schema: spec-driven

context: |
  项目 MyLSM：通过用户指挥 AI 分阶段实现 LSM Tree 学习存储引擎。
  技术栈：Java 21（无 preview）、Maven Wrapper、JUnit 5、Git。
  文档及讨论默认中文，代码标识符使用英文。
  学习优先：用户主导节奏、参与理解与关键设计决策；助手负责讲解、代码实现和验证。
  MemTable、WAL、SSTable、压缩等核心代码由助手按用户指挥逐步实现，无需另行请求代写授权；不一次性跨越关键步骤。
  每次只推进一个阶段；路线见 docs/roadmap.md，协作约定见 AGENTS.md。
  初期聚焦单进程、单线程正确性，持久性语义和文件格式在相应阶段确定。

rules:
  proposal:
    - 使用中文，明确本阶段学习目标、实现范围与非目标。
  design:
    - 说明核心不变量、设计选项与取舍，标明需要用户参与的决策。
  specs:
    - 保留 OpenSpec 要求的英文标题与 SHALL/MUST 关键词，场景正文可使用中文。
    - 描述可验证行为，区分已承诺行为与未来路线。
  tasks:
    - 使用 [用户决策]、[共同设计]、[AI 实现]、[助手支持] 标注责任，具体代码由助手编写。
    - 拆分为可讨论和验证的小步骤，包含针对性验证与学习复盘。
