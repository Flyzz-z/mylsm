schema: spec-driven

context: |
  项目 MyLSM：通过分阶段亲自实现 LSM Tree 学习存储引擎。
  技术栈：Java 21（无 preview）、Maven Wrapper、JUnit 5、Git。
  文档及讨论默认中文，代码标识符使用英文。
  学习优先：用户深度参与核心算法；助手负责引导、脚手架、评审和验证。
  未经用户明确请求，不代写 MemTable、WAL、SSTable、压缩等核心实现。
  每次只推进一个阶段；路线见 docs/roadmap.md，协作约定见 AGENTS.md。
  初期聚焦单进程、单线程正确性，持久性语义和文件格式在相应阶段确定。

rules:
  proposal:
    - 使用中文，明确本阶段学习目标、实现范围与非目标。
  design:
    - 说明核心不变量、设计选项与取舍，标明需要用户参与的决策。
  specs:
    - 保留 OpenSpec 要求的英文标题与 SHALL/MUST 关键词，场景正文可使用中文。
    - 描述可验证行为，区分已承诺行为与未来路线。
  tasks:
    - 使用 [共同设计]、[用户实现]、[助手支持] 标注责任，核心步骤默认由用户实现。
    - 拆分为小步练习，包含针对性验证与学习复盘。
